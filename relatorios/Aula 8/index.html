        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Classe customizada para Roxo (nós nos vemos na outra vida) */
        .btn-purple {
            background-color: #6f42c1;
            color: #fff;
            border-color: #6f42c1;
        }

        .btn-purple:hover {
            background-color: #59339d;
            color: #fff;
        }

        /* Estilos do grid e célula para Tabela Periódica */
        .element-cell {
            padding: 5px;
            text-align: center;
            border-radius: 6px;
            font-size: 0.8rem;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .element-cell:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        .atomic-num {
            font-size: 0.55rem;
            position: absolute;
            top: 2px;
            left: 4px;
            font-weight: bold;
        }

        .atomic-mass {
            font-size: 0.50rem;
            margin-top: 1px;
            color: rgba(255, 255, 255, 0.85);
        }

        .symbol {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .name {
            font-size: 0.55rem;
            margin-top: -3px;
        }

        .empty-cell {
            visibility: hidden;
            min-height: 80px;
        }

        .legend-box {
            width: 20px;
            height: 20px;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
            border-radius: 4px;
        }

        /* Hack do Grid do Bootstrap para suportar 18 colunas sem quebras */
        .row-cols-18>* {
            flex: 0 0 auto;
            width: 5.555%;
            /* 100% / 18 colunas = 5.555% */
            padding-left: 2px;
            padding-right: 2px;
        }

        .bg-purple {
            background-color: #59339d;
            color: #fff;
        }

        @media screen and (max-width: 1200px) {
            .row-cols-18 {
                min-width: 1100px;
                /* Impede a compressão excessiva adicionando um scroll horizonatal no container pai */
            }
        }
    </style>

                case 2: return 'btn btn-info';    // Azul
                case 3: return 'btn btn-warning'; // Laranjado
                case 4: return 'btn btn-purple';  // Roxo
                default: return 'btn btn-light';
            }

                const spacer = document.createElement('div');
                spacer.className = 'mt-3 mb-3';
                spacer.style.height = '20px';
                tabelaContainer.appendChild(spacer);
            }

            row.className = 'row row-cols-18 mb-1 justify-content-center flex-nowrap';

            for (let c = 1; c <= 18; c++) {
                const col = document.createElement('div');
                col.className = 'col p-0'; // p-0 para evitar paddings excessivos entre o gap

                // Procurar por um elemento com o per e col atuais
                let elemento = elementos.find(el => el.per === r && el.col === c);

                if (elemento) {
                    const cell = document.createElement('div');
                    // Usar .btn e as classes de cor com base na categoria
                    cell.className = `btn w-100 element-cell ${getClassPorCategoria(elemento.cat)}`;

                    const numDiv = document.createElement('div');
                    numDiv.className = 'atomic-num';
                    numDiv.innerText = elemento.n;

                    const symSpan = document.createElement('span');
                    symSpan.className = 'symbol';
                    symSpan.innerText = elemento.sym;

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'name text-truncate';
                    nameDiv.innerText = elemento.name;

                    const massDiv = document.createElement('div');
                    massDiv.className = 'atomic-mass text-truncate';
                    massDiv.innerText = elemento.m;

                    cell.appendChild(numDiv);
                    cell.appendChild(symSpan);
                    cell.appendChild(nameDiv);
                    cell.appendChild(massDiv);

                    // Tooltip base para mostrar o nome completo (nativamente html)
                    cell.title = `${elemento.name} (${elemento.sym}) - Nº: ${elemento.n} - Massa: ${elemento.m}`;

                    // Margin bem pequena para separar celulas suavemente
                    cell.style.margin = "2px";

                    col.appendChild(cell);
                } else if ((r === 8 || r === 9 || r <= 7) && (!elemento)) {
                    // Célula vazia no local
                    const empty = document.createElement('div');
                    empty.className = 'element-cell empty-cell bg-transparent border-0';
                    empty.style.margin = "2px";
                    col.appendChild(empty);
                }

                row.appendChild(col);
            }

            tabelaContainer.appendChild(row);
        }
